<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AQUA J1 Header</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">





</head>
<body>
  <div id="top"></div>

    <div id="navbar"></div>

   <section class="precision-section">
  <div class="precision-container">

    <h2 class="precision-title">
      Experience Precision.
    </h2>

    <p class="precision-text">
      Schedule an engineer-led walkthrough of the Aqua J1 series. Explore structural integration,
      real-time telemetry, and clinical-grade maintenance protocols.
    </p>

  </div>
</section>

<section class="demo-section">
  <div class="demo-wrapper">

    <div class="demo-grid">

      <!-- LEFT IMAGE -->
      <div class="demo-image">
        <img src="assets/images/book-demo.webp" alt="Water Purifier">
      </div>

      <!-- RIGHT FORM -->
      <div class="demo-form">

        <h2 class="demo-title">Free demo request</h2>
        <p class="demo-subtext">
          Please provide additional details to proceed
        </p>

        <form>

          <div class="form-group">
            <label>Name <span>*</span></label>
            <input type="text" placeholder="Name">
          </div>

          <div class="form-group">
            <label>Pin code <span>*</span></label>
            <input type="text" placeholder="Pin Code">
          </div>

          <div class="form-group">
            <label>Mobile Number <span>*</span></label>
            <input type="text" placeholder="Mobile">
          </div>

          <div class="form-group">
            <label>Email Address <span>*</span></label>
            <input type="email" placeholder="Email">
          </div>

          <div class="form-group">
            <label>Please select the water purifier <span>*</span></label>
            <select>
              <option>Search Products</option>
              <option>ZICO Copper</option>
              <option>Eric</option>
              <option>Hot and Cold</option>
              <option>Nyasa</option>
            </select>
          </div>

          <div class="form-submit">
  <button type="submit" class="btn-submit">
    Submit Request
  </button>
</div>


        </form>

      </div>

    </div>

  </div>
</section>





     <div id="footer"></div>
     <div class="nr-float">
  <a class="nr-float-btn nr-float-top" href="#top" title="Back to top">
    <i class="fa-solid fa-arrow-up"></i>
  </a>

  <a class="nr-float-btn nr-float-wa" href="https://wa.me/91XXXXXXXXXX" target="_blank" title="WhatsApp">
    <i class="fa-brands fa-whatsapp"></i>
  </a>
</div>

     </body>


     <script src="assets/main.js"></script>
