<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>8.5 TON CHILLER - Product Details</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="./assets/css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@1,700&display=swap" rel="stylesheet" />
</head>

<body>
  <div id="navbar"></div>

  <section class="pd-page">
    <div class="pd-wrap">

      <div class="pd-breadcrumb">
        Home &gt; Products &gt; Chiller &gt; 8.5 TON CHILLER
      </div>

      <div class="pd-top">

        <div class="pd-gallery">
          <div class="pd-main-img">
            <img id="mainProductImg" src="assets/images/1 TON.jpeg" alt="8.5 TON CHILLER" />
          </div>

          <div class="pd-thumbs">
            <button class="pd-thumb active" type="button" data-img="assets/images/1 TON.jpeg"><img src="assets/images/1 TON.jpeg" alt="8.5 TON CHILLER thumb 1" /></button>
            <button class="pd-thumb" type="button" data-img="assets/images/1 TON.jpeg"><img src="assets/images/1 TON.jpeg" alt="8.5 TON CHILLER thumb 2" /></button>
            <button class="pd-thumb" type="button" data-img="assets/images/1 TON.jpeg"><img src="assets/images/1 TON.jpeg" alt="8.5 TON CHILLER thumb 3" /></button>
            <button class="pd-thumb" type="button" data-img="assets/images/1 TON.jpeg"><img src="assets/images/1 TON.jpeg" alt="8.5 TON CHILLER thumb 4" /></button>
          </div>
        </div>

        <div class="pd-details">
          <h1 class="ion-model-title">MODEL: 8.5 TON RO CHILLER</h1>

          <table class="ion-spec-table">
            <thead>
              <tr>
                <th>Product</th>
                <th>Specifications</th>
              </tr>
            </thead>
            <tbody>
              <tr><td>Raw Water Pump</td><td>CRI</td></tr>
              <tr><td>RWP Motor</td><td>3 phase</td></tr>
              <tr><td>RWP Capacity</td><td>1.0 Hp</td></tr>
              <tr><td>Cooling Capacity</td><td>1500</td></tr>
            </tbody>
          </table>

          <div class="pd-actions">
            <a class="pd-btn pd-btn-outline" href="contact.html">Enquire Now</a>
            <a class="pd-btn pd-btn-fill" href="book-demo.html">Book Demo</a>
          </div>
        </div>

      </div>
    </div>
  </section>

  <div id="footer"></div>

  <script src="assets/main.js"></script>
  <script>
    (function () {
      const mainImg = document.getElementById("mainProductImg");
      const thumbBtns = document.querySelectorAll(".pd-thumb");

      thumbBtns.forEach((btn) => {
        btn.addEventListener("click", () => {
          const img = btn.getAttribute("data-img");
          if (img) mainImg.src = img;

          thumbBtns.forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
        });
      });
    })();
  </script>
</body>
</html>
